<!doctype html>

<style>
  html, body { margin: 0; padding: 0; }
  #stage {
    position: relative; width: 1200px; height: 400px; overflow: hidden;
    background:
      radial-gradient(ellipse 60% 90% at 78% 50%, #141a33 0%, rgba(10,12,22,0) 70%),
      radial-gradient(ellipse 50% 70% at 10% 100%, #10142a 0%, rgba(10,12,22,0) 70%),

  canvas { position: absolute; inset: 0; }
  .veil {

    background: linear-gradient(90deg, rgba(7,8,14,0.92) 0%, rgba(7,8,14,0.75) 34%, rgba(7,8,14,0) 58%);
  }
  .copy { position: absolute; left: 64px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow {

  h1 {
    margin: 18px 0 0; font: 400 92px/0.95 'Instrument Serif', serif; color: #f4f1ea; letter-spacing: -0.01em;
  }
  h1 em { font-style: italic; background: linear-gradient(100deg, #a5b4fc 0%, #67e8f9 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin-top: 22px; font: 400 17px/1.5 'Inter', sans-serif; color: #a3a9bf; max-width: 470px; }

  .meta span { color: #8b93ad; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1200" height="400"></canvas>
  <div class="veil"></div>
  <div class="copy">
    <div class="eyebrow">AI / ML Engineer · Full-Stack</div>
    <h1>Rohan <em>Khan</em></h1>
    <div class="tag">Building <b>intelligent web applications</b> — RAG pipelines, LLM products and the scalable backends behind them.</div>
    <div class="meta">LAHORE, PK &nbsp;/&nbsp; <span>SOFTWARE ENGINEER @ TECHVERX</span></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const N = window.FRAMES || 96;          // frames per seamless loop
const TAU = Math.PI * 2;
const W = 1200, H = 400;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x07080e, 0.028);
const camera = new THREE.PerspectiveCamera(38, W / H, 0.1, 100);
camera.position.set(0, 0.6, 15);
camera.lookAt(0, 0, 0);

// soft round glow texture
function glowTexture() {
  const s = 128, cv = document.createElement('canvas'); cv.width = cv.height = s;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.18, 'rgba(255,255,255,0.85)');
  grd.addColorStop(0.45, 'rgba(255,255,255,0.18)');
  grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTexture();
const CYAN = new THREE.Color('#67e8f9'), VIOLET = new THREE.Color('#a78bfa'), INDIGO = new THREE.Color('#818cf8'), WARM = new THREE.Color('#fcd9a8');

function sprite(color, size, opacity = 1) {
  const m = new THREE.SpriteMaterial({ map: GLOW, color, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false });
  const s = new THREE.Sprite(m); s.scale.setScalar(size); return s;
}

// seeded rng so every render is identical
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

/* ---------- perspective grid floor ---------- */
{
  const grid = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 0x2a3160, transparent: true, opacity: 0.35 });
  for (let i = -20; i <= 20; i++) {
    const g1 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, 0, -30), new THREE.Vector3(i, 0, 8)]);
    grid.add(new THREE.Line(g1, mat));
  }
  for (let j = -30; j <= 8; j++) {
    const g2 = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-20, 0, j), new THREE.Vector3(20, 0, j)]);
    grid.add(new THREE.Line(g2, mat));
  }
  grid.position.y = -3.4;
  scene.add(grid);
}

/* ---------- neural network ---------- */
const net = new THREE.Group();
net.position.set(4.7, 0.2, 0);
net.scale.setScalar(1.22);
scene.add(net);
const layers = [4, 7, 7, 5, 3];
const nodes = [];
layers.forEach((count, li) => {
  const x = (li - (layers.length - 1) / 2) * 1.55;
  const col = [];
  for (let k = 0; k < count; k++) {
    const a = (k / count) * TAU + li * 0.6;
    const r = count === 1 ? 0 : 0.55 + count * 0.16;
    const p = new THREE.Vector3(x, Math.sin(a) * r, Math.cos(a) * r * 0.9);
    const core = sprite(li % 2 ? VIOLET : CYAN, 0.42, 1);
    const halo = sprite(li % 2 ? VIOLET : CYAN, 1.3, 0.22);
    core.position.copy(p); halo.position.copy(p);
    net.add(core, halo);
    col.push({ p, core, halo, phase: rnd() });
  }
  nodes.push(col);
});
const edges = [];
const edgeMat = new THREE.LineBasicMaterial({ color: 0x6d7cff, transparent: true, opacity: 0.22, blending: THREE.AdditiveBlending, depthWrite: false });
for (let li = 0; li < nodes.length - 1; li++) {
  for (const a of nodes[li]) for (const b of nodes[li + 1]) {
    if (rnd() < 0.28) continue;
    net.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a.p, b.p]), edgeMat));
    edges.push({ a: a.p, b: b.p, li });
  }
}
// signal pulses: each travels through its edge once per loop, staggered by layer so signals cascade forward
const pulses = edges.filter(() => rnd() < 0.55).map((e) => {
  const s = sprite(e.li % 2 ? CYAN : WARM, 0.32, 1);
  net.add(s);
  return { e, s, off: e.li * 0.2 + rnd() * 0.12 };
});

/* ---------- data flows sweeping across ---------- */
const flows = [];
const FLOW_COLORS = [CYAN, VIOLET, INDIGO, CYAN, VIOLET, WARM];
for (let i = 0; i < 6; i++) {
  const y0 = -1.9 + i * 0.75;
  const ph = rnd() * TAU;
  const amp = 0.35 + rnd() * 0.5;
  const z = -2.5 + rnd() * 2.5;
  const ctrl = (f) => {
    const w = Math.sin(TAU * f / N + ph);
    return [
      new THREE.Vector3(-13, y0 - 1.2, z - 2),
      new THREE.Vector3(-6, y0 + amp * w, z),
      new THREE.Vector3(0, y0 - amp * w * 0.8, z + 1),
      new THREE.Vector3(2.4, 0.2 + (y0 * 0.3), 0.2), // converge toward the network input
    ];
  };
  const geom = new THREE.BufferGeometry();
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: FLOW_COLORS[i], transparent: true, opacity: 0.42, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(line);
  const parts = [];
  const count = 5 + Math.floor(rnd() * 4);
  for (let k = 0; k < count; k++) {
    const s = sprite(FLOW_COLORS[i], 0.24 + rnd() * 0.24, 1);
    scene.add(s);
    parts.push({ s, off: k / count + rnd() * 0.05, speed: 1 + (i % 2) });
  }
  flows.push({ ctrl, geom, parts });
}

/* ---------- ambient dust ---------- */
const dust = [];
for (let i = 0; i < 70; i++) {
  const s = sprite(rnd() < 0.5 ? INDIGO : CYAN, 0.05 + rnd() * 0.09, 0.5);
  const base = new THREE.Vector3(-12 + rnd() * 24, -3 + rnd() * 6.5, -8 + rnd() * 9);
  s.position.copy(base);
  scene.add(s);
  dust.push({ s, base, ph: rnd() * TAU, amp: 0.1 + rnd() * 0.25 });
}

function frame(f) {
  const t = f / N; // 0..1, loops seamlessly
  net.rotation.y = -0.35 + 0.32 * Math.sin(TAU * t);
  net.rotation.x = 0.08 * Math.sin(TAU * t + 1.2);

  for (const col of nodes) for (const n of col) {
    const k = 0.5 + 0.5 * Math.sin(TAU * (t + n.phase));
    n.halo.material.opacity = 0.12 + 0.22 * k;
    n.core.scale.setScalar(0.4 + 0.16 * k);
  }
  for (const p of pulses) {
    const u = ((t + p.off) % 1);
    const seg = u * 1.6; // travel during first ~62% of the loop window, rest hidden
    if (seg > 1) { p.s.visible = false; continue; }
    p.s.visible = true;
    p.s.position.lerpVectors(p.e.a, p.e.b, seg);
    p.s.material.opacity = Math.sin(Math.PI * seg);
  }
  for (const fl of flows) {
    const curve = new THREE.CatmullRomCurve3(fl.ctrl(f));
    fl.geom.setFromPoints(curve.getPoints(80));
    for (const p of fl.parts) {
      const u = (p.off + t * p.speed) % 1;
      p.s.position.copy(curve.getPoint(u));
      p.s.material.opacity = Math.min(1, u * 6) * Math.min(1, (1 - u) * 5);
    }
  }
  for (const d of dust) {
    d.s.position.y = d.base.y + d.amp * Math.sin(TAU * t + d.ph);
    d.s.position.x = d.base.x + d.amp * 0.6 * Math.cos(TAU * t + d.ph);
  }
  renderer.render(scene, camera);
}

window.renderFrame = (f) => { frame(f); return true; };
await document.fonts.ready;
frame(0);
window.READY = true;
</script>
</body>
</html>
